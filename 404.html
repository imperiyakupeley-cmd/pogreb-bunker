<!DOCTYPE html>

<head>

<style>
:root{--bg:#fbfaf7;--ink:#161d18;--muted:#5f6b62;--blue:#007599;--blue-d:#005a75;--blue-deep:#00425a;--copper:#ba7e4a;--line:#e7e3d8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.62;font-size:1.0625rem;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}

p{color:var(--muted);margin-bottom:26px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 24px;border-radius:999px;font-weight:700;font-size:15.5px;text-decoration:none;min-height:46px}
.btn-wa{background:var(--blue);color:#fff}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid #d8d2c2}
</style>
</head>
